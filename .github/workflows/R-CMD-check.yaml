name: R-CMD-check

on:
  push:
    branches: [main, master, ready_cran]
  pull_request:
    branches: [main, master, ready_cran]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} (R ${{ matrix.r }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        r: [release]
        mode: [cran, extended]
        include:
          - os: ubuntu-latest
            r: release
            mode: cran
            manual: true
          - os: macos-latest
            r: release
            mode: cran
          - os: windows-latest
            r: devel
            mode: cran
          - os: ubuntu-latest
            r: '4.1'
            mode: extended
          - os: ubuntu-latest
            r: devel
            mode: extended
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: ${{ matrix.mode == 'extended' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.manual
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Install HTML validator
        if: matrix.manual
        run: sudo apt-get update && sudo apt-get install --yes tidy
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.manual && 'c("--as-cran", "--run-donttest")' || matrix.mode == 'cran' && 'c("--no-manual", "--as-cran", "--run-donttest")' || 'c("--no-manual", "--run-donttest")' }}
          error-on: '"warning"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.os }}-${{ matrix.r }}-${{ matrix.mode }}
          path: check
